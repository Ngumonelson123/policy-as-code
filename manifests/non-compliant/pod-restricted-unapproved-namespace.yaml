# This pod should be REJECTED: it handles restricted data in demo-sandbox,
# which is not approved for restricted/confidential data.
apiVersion: v1
kind: Pod
metadata:
  name: restricted-data-app
  namespace: demo-sandbox
  labels:
    data-classification: restricted
    owner: platform-team
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: ghcr.io/REPLACE_ORG/policy-as-code-dpa-app:signed
      securityContext:
        privileged: false
