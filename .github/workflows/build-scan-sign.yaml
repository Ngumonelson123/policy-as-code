# CI half of the supply chain:
#   policy-check     -> shift-left: run the Kyverno policies against the manifests
#   build-scan-sign  -> build, SBOM (Syft), scan (Trivy), push, sign + attest (Cosign),
#                       then commit the signed digest to deploy/ for Argo CD to roll out.
#
# Required repository secrets:
#   COSIGN_PRIVATE_KEY   contents of cosign.key (from scripts/generate-cosign-key.sh)
#   COSIGN_PASSWORD      the password for that key
# Optional repository variable:
#   FAIL_ON_VULNS        set to 1 to fail the build on HIGH/CRITICAL findings
name: build-scan-sign

on:
  # Every push to main runs the full pipeline, whatever files changed.
  # No loop: the bot's own "deploy:" commit is pushed with GITHUB_TOKEN, and
  # GitHub never starts workflows from GITHUB_TOKEN pushes (it's also tagged [skip ci]).
  push:
    branches: [main]
  # Pull requests run the policy check only (no push/sign/deploy).
  pull_request:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-scan-sign-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: policy-as-code-dpa-app
  KYVERNO_CLI_VERSION: v1.15.1
  SYFT_IMAGE: anchore/syft:v1.31.0
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  COSIGN_VERSION: v2.5.3

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command in a pipe fails the step

jobs:
  policy-check:
    name: Kyverno policy check (shift-left)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          sudo mv kyverno /usr/local/bin/
          kyverno version

      # Signature verification and the namespace lookup need a live cluster,
      # so CI checks the policies that can be evaluated offline.
      - name: GitOps manifests must pass
        run: |
          kubectl kustomize deploy > rendered.yaml
          kyverno apply policies/require-data-classification-labels.yaml \
                        policies/restrict-privileged-workloads.yaml \
                        --resource rendered.yaml

      - name: Demo compliant pods must pass
        run: |
          kyverno apply policies/require-data-classification-labels.yaml \
                        policies/restrict-privileged-workloads.yaml \
                        --resource manifests/compliant/pod.yaml \
                        --resource manifests/compliant/pod-restricted-data.yaml

      - name: Demo non-compliant pods must be rejected
        run: |
          expect_fail() {
            if kyverno apply "$1" --resource "$2" >/dev/null 2>&1; then
              echo "::error::$2 passed $1 but should fail"; exit 1
            fi
            echo "OK: $2 rejected by $(basename "$1")"
          }
          expect_fail policies/require-data-classification-labels.yaml manifests/non-compliant/pod-missing-labels.yaml
          expect_fail policies/restrict-privileged-workloads.yaml     manifests/non-compliant/pod-privileged-root.yaml

  build-scan-sign:
    name: Build, SBOM, scan, sign
    needs: policy-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit the new digest to deploy/
      packages: write     # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are configured
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          [[ -n "${COSIGN_PRIVATE_KEY}" ]] || { echo "::error::Add the COSIGN_PRIVATE_KEY repository secret (contents of cosign.key)"; exit 1; }
          [[ -n "${COSIGN_PASSWORD}" ]]    || { echo "::error::Add the COSIGN_PASSWORD repository secret"; exit 1; }

      - name: Set image name
        run: |
          # GHCR requires lower-case repository names.
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -t "${IMAGE_REPO}:sha-${SHORT_SHA}" -t "${IMAGE_REPO}:signed" pipeline

      - name: Generate SBOM (Syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${SYFT_IMAGE}" \
            "docker:${IMAGE_REPO}:sha-${SHORT_SHA}" -o spdx-json > sbom.spdx.json

      - name: Scan for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
            image --severity HIGH,CRITICAL --exit-code "${{ vars.FAIL_ON_VULNS || '0' }}" \
            "${IMAGE_REPO}:sha-${SHORT_SHA}" | tee trivy-report.txt

      - name: Push
        run: |
          docker push "${IMAGE_REPO}:sha-${SHORT_SHA}"
          docker push "${IMAGE_REPO}:signed"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REPO}:sha-${SHORT_SHA}")"
          echo "DIGEST=${ref#*@}" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image and attest SBOM (Cosign, key-based, no public log)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE_REPO}@${DIGEST}"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --type spdxjson --predicate sbom.spdx.json "${IMAGE_REPO}@${DIGEST}"

      - name: Verify signature against the key the cluster trusts
        run: |
          # Use the exact public key embedded in the Kyverno policy.
          python3 - <<'PY' > policy-key.pub
          import re
          text = open("policies/require-signed-images.yaml").read()
          m = re.search(r"-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----", text, re.S)
          print("\n".join(line.strip() for line in m.group(0).splitlines()))
          PY
          cosign verify --key policy-key.pub --insecure-ignore-tlog=true "${IMAGE_REPO}@${DIGEST}" > /dev/null
          echo "Verified ${IMAGE_REPO}@${DIGEST} against the key in policies/require-signed-images.yaml"

      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence-${{ env.SHORT_SHA }}
          path: |
            sbom.spdx.json
            trivy-report.txt

      - name: Promote signed digest to deploy/ (Argo CD picks this up)
        run: |
          yq -i '.images[0].newName = strenv(IMAGE_REPO) | .images[0].digest = strenv(DIGEST)' deploy/kustomization.yaml
          git add deploy/kustomization.yaml
          if git diff --cached --quiet; then
            echo "deploy/ already points at ${DIGEST}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: ${IMAGE_REPO}@${DIGEST} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          {
            echo "### Signed image"
            echo "\`${IMAGE_REPO}@${DIGEST}\`"
            echo ""
            echo "SBOM attested, Trivy report and SBOM uploaded as build artifacts."
            echo "deploy/kustomization.yaml updated; Argo CD will roll it out."
          } >> "$GITHUB_STEP_SUMMARY"
