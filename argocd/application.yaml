# GitOps delivery: Argo CD syncs deploy/ from Git into demo-fintech.
# Kyverno still checks everything Argo CD applies — a Deployment whose
# image isn't signed with our key is rejected exactly like `kubectl apply`.
#
# argocd/install.sh replaces REPLACE_WITH_GIT_REMOTE with your repo URL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-as-code-dpa-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Ngumonelson123/policy-as-code"
    targetRevision: main
    path: deploy
  destination:
    server: "https://kubernetes.default.svc"
    namespace: demo-fintech
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD creates the namespace with the label that marks it as approved
    # for restricted/confidential data (restrict-to-approved-namespaces).
    managedNamespaceMetadata:
      labels:
        data-residency: approved
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
