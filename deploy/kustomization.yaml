# What Argo CD deploys. The GitHub Actions workflow rewrites images[0] after
# every signed build, so Git always records exactly which signed digest runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-fintech
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: policy-as-code-dpa-app
    newName: ghcr.io/ngumonelson123/policy-as-code-dpa-app
    digest: sha256:bc1a4299359b6a7fe932edf9b413a8108dc0348183c17b579a05bebcc491b008
